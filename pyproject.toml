[project]
name = "suwayomi-manga-translator"
version = "0.4.0"
description = "Automatic manga translation for Suwayomi through its HTTP image processor"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "python-multipart>=0.0.20", "pillow>=10,<12"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/suwayomi_translator"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
